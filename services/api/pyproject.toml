[project]
name = "futuro-api"
version = "0.1.0"
description = "API de futuro-app: ingesta de ofertas, scoring y selección de variante de CV."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19",
    "arq>=0.28.0",
    "asyncpg>=0.31",
    "authlib>=1.8",
    "fastapi>=0.141",
    "httpx2>=2.12",
    "itsdangerous>=2.2",
    "openai>=3.8.0",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futuro_api"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=1.4",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["futuro_api", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
