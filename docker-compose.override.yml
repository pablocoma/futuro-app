# Desarrollo local. Compose carga este fichero automáticamente sobre
# docker-compose.yml, así que no hay una segunda definición de la topología
# que pueda desincronizarse: solo lo que cambia.
#
# Lo que añade: bind mounts del código, recarga en caliente en api, worker y
# web, los puertos de Postgres y Redis expuestos al Mac, Caddy en 8080 sin
# HTTPS, y el repositorio de datos privado montado de solo lectura.
#
# El repositorio de datos: `DATA_REPO_HOST_PATH` dice qué directorio del Mac
# se monta en `/data/repo`, y por omisión es el repositorio **sintético** de
# los tests. Es lo que hace que un clon nuevo levante con `make up` y
# recorra el camino entero —pegar, extraer, puntuar, ver— sin tener el
# repositorio privado delante ni gastar nada. Apuntarlo al de verdad es una
# línea en `.env`.
#
# `DATA_REPO_PATH` en sí (la ruta *dentro* del contenedor) ya la fija
# `docker-compose.yml` para los dos entornos por igual; aquí solo cambia
# `DATA_REPO_HOST_PATH` (la ruta *fuera*, en el Mac), que en producción
# apunta al clon que deja el deploy (ver docs/deployment.md).

services:
  caddy:
    # En local Caddy escucha en :8080 dentro del contenedor (APP_DOMAIN), así
    # que el puerto publicado tiene que ser el mismo a los dos lados. Sin
    # HTTPS: no hay dominio ni certificado que resolver.
    ports: !override
      - "8080:8080"

  api:
    command:
      - uvicorn
      - futuro_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    # `!override` y no añadir: `docker-compose.yml` ya monta un
    # `/data/repo` propio (el clon de producción), y sumarse dejaría dos
    # montajes peleándose por la misma ruta dentro del contenedor.
    volumes: !override
      # Solo el código: .venv se queda la del contenedor, que es la que
      # coincide con uv.lock para linux/arm64.
      - ./services/api/src:/app/src
      - ./services/api/migrations:/app/migrations
      - ${DATA_REPO_HOST_PATH:-./services/api/tests/fixtures/data_repo}:/data/repo:ro
    environment:
      ENV: development
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"

  web:
    build:
      context: ./services/web
      target: builder
    # -H 0.0.0.0 para que el servidor de desarrollo acepte conexiones desde
    # fuera del contenedor y no solo desde su propio localhost.
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0"]
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./services/web/src:/app/src
      - ./services/web/next.config.ts:/app/next.config.ts
    ports:
      - "3000:3000"

  worker:
    # `arq --watch` reinicia el worker al cambiar el código, igual que
    # `--reload` en uvicorn. Sin esto habría que hacer `docker compose
    # restart worker` en cada cambio, y se olvida.
    command:
      - arq
      - futuro_api.jobs.worker.WorkerSettings
      - --watch
      - /app/src
    volumes: !override
      - ./services/api/src:/app/src
      - ${DATA_REPO_HOST_PATH:-./services/api/tests/fixtures/data_repo}:/data/repo:ro
    environment:
      ENV: development
      LOG_LEVEL: DEBUG

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
