name: ci

# Etapas de ARCHITECTURE.md §11 para la rama de trabajo. `main` añade encima
# el build con push y el deploy: ver deploy.yml.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
  # Lo invoca deploy.yml para no duplicar las etapas en la rama main.
  workflow_call: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: fugas de datos
    # El primer principio del repositorio es que aquí no entran datos
    # personales. Esto es lo que lo comprueba en cada push, en vez de
    # confiar en la revisión manual.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # gitleaks-action NO autodetecta el .gitleaks.toml de la raíz:
          # hay que señalárselo. Sin esto, en un push pasa —solo escanea los
          # commits nuevos— pero en un PR escanea el rango entero, aplica la
          # configuración por defecto y salta con el falso positivo de la URL
          # interna de la API. Es exactamente lo que bloqueó el PR #1.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  cv-builder:
    name: cv_builder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    # Postgres entra aquí desde M1: los tests de esquema comprueban
    # constraints y triggers, que no existen en ningún otro sitio. Los tests
    # de la aplicación siguen sin necesitarlo —el camino degradado es uno de
    # los casos que hay que cubrir— pero ya no son los únicos que hay.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: futuro
          POSTGRES_USER: futuro
          POSTGRES_PASSWORD: futuro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U futuro -d futuro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: futuro
      POSTGRES_PASSWORD: futuro
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: services/api
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

      # El deploy hace `alembic upgrade head` y su rollback NO revierte
      # esquema, así que la reversibilidad no se puede comprobar en
      # producción: se comprueba aquí. `check` detecta que los modelos y las
      # migraciones se hayan desincronizado; el ciclo hasta `base` y de
      # vuelta prueba que cada `downgrade` deshace de verdad su `upgrade`.
      - name: Migraciones
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: e2e
    needs: [api, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar el stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 300
          # Igual que en el deploy: el contenedor no migra al arrancar, se
          # migra como un paso aparte. Sin esto no hay tablas y la ingesta
          # falla, que es justo lo que el E2E viene a comprobar.
          docker compose exec -T api alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke test
        working-directory: e2e
        run: npm test

      - name: Logs del stack si algo falla
        if: failure()
        run: docker compose logs --no-color

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  images:
    name: imágenes (arm64)
    runs-on: ubuntu-24.04-arm
    # Runner arm64 nativo, gratis por ser un repositorio público: las
    # imágenes se construyen para la misma arquitectura que la VM de Oracle
    # en lugar de emular con QEMU.
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
